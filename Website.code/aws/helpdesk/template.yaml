AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio website helpdesk backend powered by Lambda, API Gateway, DynamoDB and SES.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 512
    Architectures:
      - x86_64

Parameters:
  HelpdeskFromEmail:
    Type: String
    Description: Verified SES sender address used for outbound helpdesk emails.
  HelpdeskNotificationEmails:
    Type: String
    Default: ''
    Description: Comma-separated addresses that should receive new-ticket notifications.
  HelpdeskAppUrl:
    Type: String
    Default: https://alistairsweeting.online/#/helpdesk/admin
    Description: URL to the admin dashboard, included in notification emails.
  AdminEmail:
    Type: String
    Description: Admin login email for the helpdesk dashboard.
  AdminName:
    Type: String
    Default: Admin
    Description: Display name for the initial helpdesk admin user.
  AdminPasswordSha256:
    Type: String
    NoEcho: true
    Description: SHA-256 hash of pepper:password for the initial helpdesk admin user.
  AdminPasswordPepper:
    Type: String
    NoEcho: true
    Description: Extra secret appended before hashing admin passwords.
  AdminJwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign helpdesk admin session tokens.

Resources:
  HelpdeskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  HelpdeskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

  HelpdeskApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api.handler
      Environment:
        Variables:
          HELP_DESK_TABLE_NAME: !Ref HelpdeskTable
          HELP_DESK_FROM_EMAIL: !Ref HelpdeskFromEmail
          HELP_DESK_NOTIFICATION_EMAILS: !Ref HelpdeskNotificationEmails
          HELP_DESK_APP_URL: !Ref HelpdeskAppUrl
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_NAME: !Ref AdminName
          ADMIN_PASSWORD_SHA256: !Ref AdminPasswordSha256
          ADMIN_PASSWORD_PEPPER: !Ref AdminPasswordPepper
          ADMIN_JWT_SECRET: !Ref AdminJwtSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HelpdeskTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HelpdeskApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HelpdeskApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  HelpdeskApiUrl:
    Description: Base URL for the helpdesk frontend.
    Value: !Sub https://${HelpdeskApi}.execute-api.${AWS::Region}.amazonaws.com
  HelpdeskTableName:
    Description: DynamoDB table storing tickets and replies.
    Value: !Ref HelpdeskTable